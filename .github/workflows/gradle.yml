# 워크플로우 이름 (GitHub Actions 탭에 표시됨)
name: Spring Boot CI

# [트리거] 이 워크플로우가 언제 자동으로 실행될지 조건 설정
on:
  push:
    branches: [ "main" ] # main 브랜치에 소스 코드가 push(업로드)되었을 때
  pull_request:
    branches: [ "main" ] # 다른 브랜치에서 main으로 Pull Request(합병 요청)가 들어왔을 때


# [작업 단위] 실제 가상 머신(서버)에서 수행할 작업 정의
jobs:
  build:
    # GitHub에서 제공하는 가상 머신 중 최신 Ubuntu 리눅스를 대여해서 실행하겠다는 의미
    runs-on: ubuntu-latest

    # [컨테이너 서비스 띄우기]
    # 테스트 과정에서 Redis가 필요한 경우, 가상 머신 안에 Docker로 Redis를 미리 실행해 둡니다.
    services:
      redis:
        image: redis:latest # Docker Hub에서 최신 Redis 이미지를 가져옴
        ports:
          - 6379:6379     # 리눅스 가상머신의 6379 포트와 Redis 컨테이너의 6379 포트를 연결
        options: >-       # Redis가 정상적으로 켜졌는지 헬스체크(Health Check) 수행
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # [실행 단계] 가상 머신 내부에서 순차적으로 실행할 명령어 목록
    steps:
      # Step 1: 내 GitHub 리포지토리에 있는 소스 코드를 가상 머신 안으로 다운로드(Checkout)함
      - uses: actions/checkout@v3

      # Step 2: 빌드에 필요한 자바(JDK) 환경을 설치
      # Java 21 환경이시므로 java-version을 '21'로 변경합니다.
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'      # 본인 프로젝트 자바 버전에 맞게 수정
          distribution: 'temurin' # 가장 널리 쓰이는 Eclipse Temurin OpenJDK 사용

      # Step 3: 리눅스 환경에서 ./gradlew 실행 파일을 동작시킬 수 있도록 실행 권한(+x) 부여
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: ./back-end  # back-end 폴더 안으로 이동해서 권한 부여

      # Step 4: 이전 빌드 결과물을 깨끗이 지우고(clean), 처음부터 다시 빌드 및 테스트(build) 진행
      # 이 과정에서 @SpringBootTest 같은 테스트 코드들이 실행되며, 위에 띄운 Redis와 통신하게 됩니다.
      - name: Build with Gradle
        run: ./gradlew clean build --info
        working-directory: ./back-end  # back-end 폴더 안으로 이동해서 권한 부여
        env:
          # Spring Boot가 yml의 jwt.secret으로 자동 매핑함
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_COOKIE_ACCESS_TOKEN_MAX_AGE: ${{ secrets.JWT_COOKIE_ACCESS_TOKEN_MAX_AGE }}
          JWT_COOKIE_REFRESH_TOKEN_MAX_AGE: ${{ secrets.JWT_COOKIE_REFRESH_TOKEN_MAX_AGE }}
          JWT_COOKIE_SECURE: ${{ secrets.JWT_COOKIE_SECURE }}

          # Spring Boot가 yml의 admin.activation-key로 자동 매핑함
          ADMIN_ACTIVATION_KEY: ${{ secrets.ADMIN_ACTIVATION_KEY }}

          # Spring Boot가 yml의 file.upload.dir 등으로 자동 매핑함
          FILE_UPLOAD_DIR: ${{ secrets.FILE_UPLOAD_DIR }}
          FILE_UPLOAD_MAX_SIZE: ${{ secrets.FILE_UPLOAD_MAX_SIZE }}